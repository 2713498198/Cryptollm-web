server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cryptollm-server
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cryptollm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

cryptollm:
  auth:
    sms-code-expire-seconds: ${SMS_CODE_EXPIRE_SECONDS:300}
    sms-resend-interval-seconds: ${SMS_RESEND_INTERVAL_SECONDS:60}
    token-expire-seconds: ${TOKEN_EXPIRE_SECONDS:604800}
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
